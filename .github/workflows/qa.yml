name: QA ServeRest
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Suíte Chrome
        run: npm run test:ci
      - name: Evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-results
          path: |
            test-results/
            cypress/screenshots/
          if-no-files-found: ignore
          retention-days: 7

